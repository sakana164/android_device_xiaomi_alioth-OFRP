name: 🦊 OrangeFox for alioth - 构建

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox 清单分支'
        required: true
        default: '12.1'
        type: choice
        options:
          - 14.1
          - 12.1
      DEVICE_TREE:
        description: 'OrangeFox 设备树'
        required: true
        default: 'https://github.com/sakana164/android_device_xiaomi_alioth-OFRP'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox 设备树分支'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: '输入你的设备路径'
        required: true
        default: 'device/xiaomi/alioth'
      DEVICE_NAME:
        description: '输入你的设备代号'
        required: true
        default: 'alioth'
      BUILD_TARGET:
        description: '选择你的构建目标'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      MAGISK_VERSION:
        description: '选择你的Magisk版本'
        required: true
        default: 'None'
        type: choice
        options:
          - Magisk
          - MagiskAlpha
          - None
      USE_CCACHE:
        description: '是否使用 ccache 编译'
        type: boolean
        required: true
        default: true
      OF_MAINTAINER:
        description: '输入维护者名称'
        required: true
        default: 'sakana164'

jobs:
  build:
    name: 🏗️ 构建 OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: 🧹 清理空间
      uses: rokibhasansagar/slimhub_actions@main

    - name: 💾 设置交换空间
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: 🛒 检出代码
      uses: actions/checkout@v4

    - name: 🛠️ 构建环境
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: 📜 同步 OrangeFox 源码清单
      if: inputs.MANIFEST_BRANCH == '12.1' || inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: 📡 修复 fox_14.1 WLAN 支持
      if: inputs.MANIFEST_BRANCH == '14.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_14.1 && git cherry-pick 4aaf601 99e35fe 1ccd5e3

    - name: 📥 克隆设备树
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: ⚡ 更新 OrangeFox 的内置 Magisk
      if: inputs.MAGISK_VERSION != 'None'
      run: |
        git clone https://github.com/ymdzq/twrp_prebuilt ~/twrp_prebuilt
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}
        if ! grep -q 'FOX_USE_SPECIFIC_MAGISK_ZIP' vendorsetup.sh; then (echo 'export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk'>>vendorsetup.sh && echo "Added FOX_USE_SPECIFIC_MAGISK_ZIP in vendorsetup.sh"); else sed -i 's/.*export FOX_USE_SPECIFIC_MAGISK_ZIP.*/export FOX_USE_SPECIFIC_MAGISK_ZIP=\~\/twrp_prebuilt\/Magisk\/${{ inputs.MAGISK_VERSION }}.apk/' vendorsetup.sh; fi

    - name: 💾 设置ccache缓存
      if: inputs.USE_CCACHE == true
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_TREE_BRANCH }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-
          ${{ runner.os }}-ccache-${{ inputs.DEVICE_NAME }}-
          ${{ runner.os }}-ccache-

    - name: 🔨 构建 OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        if [ "${{ inputs.USE_CCACHE }}" = "true" ]; then
          export CCACHE_DIR=~/.ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 50G
          ccache -o compression=true
        fi
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export OF_MAINTAINER=${{ inputs.OF_MAINTAINER }}
        export FOX_USE_NANO_EDITOR=1
        set -e
        if [[ ${{ inputs.MANIFEST_BRANCH }} == '14.1' ]]; then
          lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        else
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        fi

    - name: 📊 显示ccache统计信息
      if: inputs.USE_CCACHE == true
      run: |
        ccache -sv

    - name: 🏷️ 设置发布属性
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: 📦 处理输出文件
      run: |
        OUT_DIR=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}
        for f in "$OUT_DIR"/OrangeFox*.img "$OUT_DIR"/OrangeFox*.zip; do
          [ -e "$f" ] || continue
          base=$(basename "$f")
          ext="${base##*.}"
          name="${base%.*}"
          mv "$f" "$OUT_DIR/${name}-${BUILD_DATE}.${ext}"
        done

    - name: 🚀 上传至 Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial

          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Build Target: ${{ inputs.BUILD_TARGET }}
          Device Tree: ${{ inputs.DEVICE_TREE }}
          Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          Maintainer: ${{ inputs.OF_MAINTAINER }}
          Build Date: ${{ env.BUILD_DATE }}
